<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MUSE">
<meta name="description" content="좋아하는 연예인 사진 5장으로 내 취향의 가상인물을 만들고, 그 인물로 사진·영상을 계속 만드는 앱">
<meta name="author" content="double-hee">
<meta name="copyright" content="© 2026 double-hee. All rights reserved.">
<title>MUSE · 내 취향 가상인물 스튜디오</title>
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="touchIcon">
<link rel="icon" id="favIcon">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#07070c;--card:#11111a;--card2:#171724;--card3:#1f1f31;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --text:#f6f4ff;--sub:#aeaacb;--dim:#6f6b8e;
  --pink:#ff4fd8;--violet:#a55cff;--cyan:#22e1ff;--green:#3ef0a6;
  --grad:linear-gradient(135deg,#ff4fd8 0%,#a55cff 52%,#22e1ff 100%);
  --r:20px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);background:var(--bg);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;background:radial-gradient(40vmax 40vmax at 85% 15%,rgba(165,92,255,.22),transparent 70%),radial-gradient(36vmax 36vmax at 10% 45%,rgba(255,79,216,.14),transparent 70%),radial-gradient(40vmax 40vmax at 60% 100%,rgba(34,225,255,.10),transparent 70%)}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
img,video{display:block;max-width:100%}
a{color:var(--cyan)}
b{font-weight:700}
svg.i{width:20px;height:20px;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(130px + var(--sb))}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;margin:0 -16px 6px;padding:calc(10px + var(--st)) 16px 10px;background:linear-gradient(rgba(7,7,12,.94),rgba(7,7,12,.78));backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1)}
.icon-btn.on{color:var(--pink)}
.text-btn{color:var(--sub);font-size:14px;font-weight:600;padding:8px 4px}
.text-btn.small{font-size:13px;margin-top:12px;display:inline-block}
.brand{flex:1;display:flex;flex-direction:column;line-height:1.1}
.logo{font-size:26px;font-weight:900;letter-spacing:.14em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,79,216,.45))}
.brand-sub{font-size:12px;color:var(--sub);margin-top:4px}

/* cards & text */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card-title{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:16px;font-weight:700}
.card-title svg{width:18px;height:18px;color:var(--pink)}
.opt{font-size:11px;font-weight:600;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:1px 7px}
.sub{color:var(--sub);font-size:13.5px;margin:4px 0 0}
.hint{color:var(--dim);font-size:12.5px;margin:10px 0 0}
.hint svg{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.hint b{color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--pink);margin-bottom:8px}
.tag svg{width:14px;height:14px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.center{text-align:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:16px;font-weight:700;font-size:16px;transition:transform .12s,box-shadow .2s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn-primary{color:#fff;background:var(--grad);box-shadow:0 8px 28px rgba(255,79,216,.28),inset 0 0 0 1px rgba(255,255,255,.14)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--text)}
.btn-danger{background:rgba(255,92,124,.1);border:1px solid rgba(255,92,124,.35);color:#ff8aa3}
.btn.full{width:100%}
.btn-primary:disabled{opacity:1;background:#252536;color:#6f6b8e;box-shadow:none}
.btn-ghost:disabled{opacity:1;background:#15151f;color:#5d5a78}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:14px 16px calc(12px + var(--sb));background:linear-gradient(rgba(7,7,12,0),rgba(7,7,12,.97) 14px,rgba(7,7,12,.99))}
.bottom-bar .btn-ghost{background:#15151f}
.bottom-bar .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.bottom-bar .in .btn{flex:1}
.bottom-bar .in .btn-ghost{flex:0 0 34%}
.bb-note{max-width:528px;margin:7px auto 0;text-align:center;font-size:11.5px;color:var(--dim)}

/* chips / segmented / inputs */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--sub);font-size:14px;font-weight:600;display:inline-flex;align-items:center}
.chip.on{color:#fff;background:linear-gradient(var(--card3),var(--card3)) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 0 16px rgba(255,79,216,.22)}
.chip.static{height:30px;font-size:13px;padding:0 11px;color:var(--text)}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;height:38px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button.on{background:var(--card3);color:#fff;box-shadow:inset 0 0 0 1px var(--line2),0 4px 14px rgba(0,0,0,.35)}
.field{margin-top:14px}
.field>label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px}
.input{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line2);outline:none;font-size:16px;color:var(--text);resize:vertical}
.input:focus{border-color:rgba(255,79,216,.6);box-shadow:0 0 0 3px rgba(255,79,216,.15)}
.input::placeholder{color:var(--dim)}
textarea.input{line-height:1.5}
details>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--sub);list-style:none;display:flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;transition:transform .2s;font-size:20px;line-height:1;color:var(--pink)}
details[open]>summary::before{transform:rotate(90deg)}
.adv{margin-top:16px}

/* home */
.hero{padding:18px 2px 4px}
.hero h2{font-size:26px;line-height:1.32;margin:0 0 16px;font-weight:800;letter-spacing:-.025em}
.how{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.how li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
.how i{font-style:normal;width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--grad)}
.sec-title{font-size:15px;font-weight:800;margin:16px 2px 0}
.sec-title em{font-style:normal;color:var(--pink);margin-left:4px}
.key-card{overflow:hidden}
.key-card>b{font-size:16px;display:block}
.key-card .btn{margin-top:14px}
.key-glow{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,216,.35),transparent 70%);pointer-events:none}
.char-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.char-card{position:relative;display:block;width:100%;text-align:left;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.char-card:active{transform:scale(.98)}
.char-card .cover{position:relative;aspect-ratio:3/4;background:var(--card2)}
.char-card .cover img{width:100%;height:100%;object-fit:cover}
.char-card .cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(transparent,rgba(7,7,12,.94))}
.char-card .meta{position:absolute;left:12px;right:12px;bottom:10px;z-index:1}
.char-card .meta b{display:block;font-size:17px}
.char-card .meta span{font-size:12px;color:var(--sub)}
.char-card.new{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;border:1.5px solid rgba(255,79,216,.42);background:radial-gradient(circle at 50% 38%,rgba(255,79,216,.2),transparent 62%),var(--card)}
.char-card.new .plus{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--grad);box-shadow:0 0 26px rgba(255,79,216,.5);margin-bottom:10px}
.char-card.new .plus svg{width:28px;height:28px;color:#fff}
.char-card.new b{font-size:15px}
.char-card.new small{font-size:12px;color:var(--sub)}
.pill{position:absolute;top:10px;left:10px;z-index:2;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.62);border:1px solid rgba(255,79,216,.55)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* create */
.stepper{display:flex;gap:6px;margin:10px 0 4px}
.stepper button{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--dim);text-align:left}
.stepper button:disabled{opacity:1;cursor:default}
.stepper i{height:4px;border-radius:4px;background:rgba(255,255,255,.08)}
.stepper .on{color:var(--text)}
.stepper .on i{background:var(--grad);box-shadow:0 0 10px rgba(255,79,216,.5)}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.slot{position:relative;aspect-ratio:3/4;border-radius:16px;border:1.5px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:12px;font-weight:700;overflow:hidden}
.slot svg{width:26px;height:26px;color:var(--pink)}
.slot.filled{border:0}
.slot img{width:100%;height:100%;object-fit:cover}
.slot-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.62);display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.slot-x svg{width:15px;height:15px;color:#fff}
.slot-num{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 4px #000}
.slot-info{aspect-ratio:3/4;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;font-size:12px;color:var(--sub);padding:8px;background:radial-gradient(circle at 50% 35%,rgba(255,79,216,.2),transparent 70%)}
.slot-info b{font-size:30px;font-weight:900;color:var(--text);line-height:1}
.slot-info b small{font-size:14px;color:var(--dim)}
.summary{font-size:15px;line-height:1.65;margin:0 0 12px}
.facts{display:flex;gap:8px;margin-top:12px}
.facts span{font-size:13px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.persona-full{color:var(--sub);font-size:14px;margin:10px 0 0}
.cand-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cand{position:relative;display:block;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--card2);border:2px solid transparent}
.cand img{width:100%;height:100%;object-fit:cover}
.cand.sel{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,79,216,.22),0 0 30px rgba(255,79,216,.35)}
.cand .ck{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center}
.cand .ck svg{width:17px;height:17px;color:#fff}
.cand .state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;color:var(--sub);text-align:center;padding:12px}
.cand.err{border-color:rgba(255,92,124,.35)}
.mini{font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line2);color:var(--text)}

/* loaders */
.loader{display:flex;flex-direction:column;align-items:center;text-align:center;padding:38px 16px}
.orb{width:96px;height:96px;border-radius:50%;background:conic-gradient(from 0deg,#ff4fd8,#a55cff,#22e1ff,#ff4fd8);animation:spin 2.4s linear infinite;box-shadow:0 0 40px rgba(255,79,216,.45),0 0 80px rgba(34,225,255,.22);position:relative}
.orb::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#0b0b13}
.loader h3{margin:22px 0 4px;font-size:17px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:22px;height:22px;flex:none;border-radius:50%;border:2.5px solid rgba(255,255,255,.15);border-top-color:var(--pink);animation:spin .8s linear infinite}
.spinner.sm{width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:-3px}
.spinner.lg{width:42px;height:42px;border-width:3px}
.shimmer{background:linear-gradient(110deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.04) 70%) var(--card2);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.progress{display:flex;align-items:center;gap:12px}
.progress .pt{flex:1;min-width:0}
.progress .pt b{font-size:15px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .4s}
.bar.indet i{width:30%!important;animation:indet 1.4s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}

/* character */
.char-head{display:flex;gap:14px;align-items:center;margin:10px 0 4px}
.avatar{width:86px;height:86px;border-radius:50%;padding:3px;background:var(--grad);flex:none;box-shadow:0 0 26px rgba(255,79,216,.35)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg)}
.char-info{min-width:0}
.name-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name-row b{font-size:22px}
.name-row span{color:var(--sub);font-size:13px}
.kw{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:4px;font-size:12.5px;color:var(--pink);font-weight:600}
.persona{color:var(--sub);font-size:13px;margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.refs{margin:12px 0 0}
.refs-head{display:flex;align-items:center;gap:6px;font-size:13px}
.refs-head svg{width:15px;height:15px;color:#ffd65c}
.refs-head small{color:var(--dim);margin-left:auto;font-size:11.5px}
.refs-row{display:flex;gap:8px;margin-top:8px}
.refs-row button{width:56px;height:56px;border-radius:14px;overflow:hidden;border:1px solid var(--line2)}
.refs-row img{width:100%;height:100%;object-fit:cover}
.ref-add{display:grid;place-items:center;border:1.5px dashed rgba(255,255,255,.2)!important;color:var(--dim)}
.tabs{position:sticky;top:calc(61px + var(--st));z-index:20;display:flex;gap:6px;margin:14px -16px 0;padding:8px 16px;background:rgba(7,7,12,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs button{flex:1;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-weight:700;font-size:14px;color:var(--sub);background:rgba(255,255,255,.03);border:1px solid var(--line)}
.tabs button svg{width:17px;height:17px}
.tabs button.on{color:#fff;background:linear-gradient(var(--card3),var(--card3)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.tabs em{font-style:normal;font-size:11.5px;color:var(--pink)}
.scene-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.scene{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:70px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--sub);padding:4px;text-align:center;line-height:1.2;word-break:keep-all}
.scene .e{font-size:22px;line-height:1}
.scene.on{color:#fff;background:linear-gradient(var(--card3),var(--card3)) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 0 18px rgba(255,79,216,.22)}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.recent button{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--card2)}
.recent img{width:100%;height:100%;object-fit:cover}
.pick-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:10px -2px 0;scrollbar-width:none}
.pick-row::-webkit-scrollbar{display:none}
.pick{flex:none;width:78px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:2px solid transparent;opacity:.72}
.pick.on{border-color:var(--pink);opacity:1;box-shadow:0 0 16px rgba(255,79,216,.4)}
.pick img{width:100%;height:100%;object-fit:cover}
.job{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-top:10px}
.job img{width:54px;height:72px;border-radius:10px;object-fit:cover;flex:none}
.job .jt{flex:1;min-width:0}
.job .jt b{font-size:14px}
.job .jt p{margin:2px 0 0;font-size:12.5px;color:var(--sub)}
.job .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-right:6px;vertical-align:1px;animation:pulse 1.2s infinite}
.job .mini-hint{font-size:11.5px;color:var(--dim)}
.job.fail{border-color:rgba(255,92,124,.35)}
.job.fail .jt p{color:#ff8aa3}
.job .acts{display:flex;gap:6px;margin-top:8px}
.filter-row{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.gal-item{position:relative;display:block;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2)}
.gal-item img{width:100%;height:100%;object-fit:cover}
.jt-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#fff}
.badge{position:absolute;display:grid;place-items:center;border-radius:99px}
.badge.play{right:6px;bottom:6px;width:26px;height:26px;background:rgba(0,0,0,.58);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge.play svg{width:12px;height:12px;margin-left:2px}
.badge.star{left:6px;top:6px;width:22px;height:22px;background:rgba(0,0,0,.58);color:#ffd65c}
.badge.star svg{width:13px;height:13px;fill:#ffd65c}
.empty{text-align:center;padding:40px 16px;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:6px}

/* settings */
.key-row{display:flex;gap:8px;margin-top:8px}
.row2{display:flex;gap:8px;margin-top:10px}
.row2 .btn{flex:1;height:46px;font-size:15px}
.ok-pill{font-size:11px;font-weight:800;color:#06140e;background:var(--green);padding:2px 8px;border-radius:99px;margin-left:auto}
.guide{margin-top:14px}
.guide ol{padding-left:20px;margin:10px 0 6px;font-size:14px}
.guide li{margin:6px 0}
.cost-list{list-style:none;padding:0;margin:8px 0 0}
.cost-list li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cost-list li span{color:var(--sub)}
.usage{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;color:var(--sub)}
.usage .text-btn{margin:0;flex:none}
.test-list{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.test-list>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.test-list small{display:block;color:var(--dim);font-size:12px;word-break:break-all}
.test-list>div>span:first-child{min-width:0}
.test-list>div>span:last-child{white-space:nowrap}
.ok{color:var(--green);font-weight:700}
.bad{color:#ff8aa3;font-weight:700}
.dim{color:var(--dim)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:12px 0 4px;color:var(--sub)}
.check input{width:18px;height:18px;accent-color:#ff4fd8}
.col{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.col .btn{width:100%;height:48px;font-size:15px}
.backup-ready{padding:12px;border-radius:14px;background:rgba(62,240,166,.07);border:1px solid rgba(62,240,166,.3);font-size:13px;color:var(--sub)}
.foot{text-align:center;color:var(--dim);font-size:12px;margin:24px 0;line-height:1.7}
.raw{white-space:pre-wrap;word-break:break-all;font-size:11.5px;color:var(--dim);background:rgba(0,0,0,.3);padding:10px;border-radius:10px;max-height:200px;overflow:auto;margin:8px 0 0}

/* viewer */
.viewer{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;animation:fade .18s ease}
.v-top{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--st)) 12px 8px}
.v-count{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--sub)}
.v-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y}
.v-stage img,.v-stage video{max-width:100%;max-height:100%;object-fit:contain}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:72px;display:grid;place-items:center;color:#fff;opacity:.55}
.v-nav.l{left:0}.v-nav.r{right:0}
.v-nav svg{width:28px;height:28px}
.v-info{padding:10px 16px;font-size:13px;color:var(--sub);max-height:28vh;overflow:auto;border-top:1px solid rgba(255,255,255,.08)}
.v-info.hide{display:none}
.v-info small{display:block;color:var(--dim);font-size:11.5px;margin-top:6px;white-space:pre-wrap}
.v-actions{display:flex;justify-content:space-around;padding:10px 6px calc(10px + var(--sb));border-top:1px solid rgba(255,255,255,.08);background:rgba(12,12,18,.95)}
.v-actions button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--text);min-width:54px;padding:4px 2px}
.v-actions button svg{width:23px;height:23px}
.v-actions button.on{color:#ffd65c}
.v-actions button.on svg{fill:#ffd65c}

/* sheet & toast */
.sheet-back{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;background:#141420;border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--sb));animation:up .22s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h3{margin:0 0 8px;font-size:18px}
.sheet>p{color:var(--sub);margin:0 0 16px;font-size:14px;white-space:pre-wrap}
.sheet .menu button{display:flex;align-items:center;gap:12px;width:100%;height:54px;padding:0 6px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.sheet .menu button svg{color:var(--sub)}
.sheet .menu button.danger,.sheet .menu button.danger svg{color:#ff8aa3}
.sheet .row{display:flex;gap:10px;margin-top:8px}
.sheet .row .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;left:0;right:0;top:calc(68px + var(--st));z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{max-width:480px;background:rgba(30,30,46,.97);border:1px solid var(--line2);color:var(--text);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(-10px);transition:.25s;text-align:center}
.toast.show{opacity:1;transform:none}
@media (min-width:600px){.scene-grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>

const DB = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open('muse-studio', 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('chars')) db.createObjectStore('chars', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath: 'id' }).createIndex('charId', 'charId');
      if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('jobs')) db.createObjectStore('jobs', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => { p = null; rej(r.error); };
    r.onblocked = () => rej(new Error('저장소가 다른 탭에서 사용 중이에요. 다른 탭을 닫아 주세요.'));
  }));
  const run = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('저장에 실패했어요'));
    });
  };
  return {
    get: (s, k) => run(s, 'readonly', st => st.get(k)),
    all: s => run(s, 'readonly', st => st.getAll()),
    byIndex: (s, i, v) => run(s, 'readonly', st => st.index(i).getAll(v)),
    put: (s, v) => run(s, 'readwrite', st => st.put(v)),
    del: (s, k) => run(s, 'readwrite', st => st.delete(k)),
    clear: s => run(s, 'readwrite', st => st.clear()),
  };
})();

async function resizeBlob(blob, max, q = 0.86) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await loadImg(url);
    const w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(1, max / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, cw, ch); g.drawImage(img, 0, 0, cw, ch);
    const out = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (!out) throw new Error('이미지 변환에 실패했어요');
    return { blob: out, w: cw, h: ch };
  } finally { URL.revokeObjectURL(url); }
}

class ApiError extends Error { constructor(msg, extra = {}) { super(msg); Object.assign(this, extra); } }

async function gfetch(path, { method = 'POST', body, key = getKey() } = {}) {
  if (!key) throw new ApiError('API 키가 없어요', { code: 'NO_KEY' });
  let res;
  try {
    res = await fetch(API + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json', 'x-goog-api-key': key } : { 'x-goog-api-key': key },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw new ApiError('네트워크 오류: ' + (e && e.message || e), { network: true }); }
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!res.ok) {
    const err = (data && data.error) || data || {};
    throw new ApiError(err.message || err.status || err.raw || `HTTP ${res.status}`, { status: res.status, apiStatus: err.status });
  }
  return data;
}

const modelOK = {};
function isModelMissing(e) {

  return e.status === 400 && /model/i.test(e.message) && /(not found|not exist|unknown|unsupported|not supported|invalid model)/i.test(e.message);
}
const OPTIONAL = [
  { path: ['store'], re: /\bstore\b/i },
  { path: ['response_format', 'mime_type'], re: /mime_?type/i },
  { path: ['response_format', 'image_size'], re: /image_?size/i },
  { path: ['generation_config'], re: /thinking|generation_?config|video_?config|\btask\b/i },

function stripOptional(b, msg) {
  for (const o of OPTIONAL) {
    if (!o.re.test(msg)) continue;
    const key = o.path[o.path.length - 1];
    const parent = o.path.slice(0, -1).reduce((x, k) => x && x[k], b);
    if (parent && key in parent) { delete parent[key]; return true; }

}
// Interactions API 호출 (모델 이름이 바뀌었을 때 예비 모델로 자동 전환)
async function callModel(kind, body, { background = false } = {}) {
  const m = getModels();
  const list = [modelOK[kind], m[kind], ...MODEL_FALLBACKS[kind]].filter((v, i, a) => v && a.indexOf(v) === i);
  let firstErr = null;
  for (const model of list) {
    const b = { ...body, model };
    if (body.response_format) b.response_format = { ...body.response_format };
    if (background) b.background = true;
    let lastErr = null;
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        const r = await gfetch('/interactions', { body: b });
        modelOK[kind] = model;
        return r;
      } catch (e) {
        lastErr = e;
        if (e.status === 400 && b.background && /background/i.test(e.message)) { delete b.background; continue; }
        if (e.status === 400 && stripOptional(b, e.message)) continue;
        break;

    }
    if (isModelMissing(lastErr)) { firstErr = firstErr || lastErr; continue; }
    throw lastErr;
  }
  throw firstErr || new ApiError('사용할 수 있는 모델을 찾지 못했어요. 설정 > 모델 설정을 확인해 주세요.');
}
// 응답(steps 스키마)에서 텍스트·이미지·영상 꺼내기
function extractOutputs(inter) {
  const out = { images: [], videos: [], texts: [] };
  if (!inter || typeof inter !== 'object') return out;
  let items = [];
  if (Array.isArray(inter.steps)) {
    for (const s of inter.steps) {
      if (!s || s.type === 'user_input' || s.type === 'thought') continue;
      if (Array.isArray(s.content)) items.push(...s.content);
    }
  } else if (Array.isArray(inter.outputs)) items = inter.outputs.filter(o => o && o.type !== 'thought');
  for (const c of items) {
    if (!c) continue;
    const inl = c.inline_data || c.inlineData || {};
    const data = c.data || inl.data;
    const mime = c.mime_type || c.mimeType || inl.mime_type || inl.mimeType || '';
    const t = c.type || (mime.startsWith('image/') ? 'image' : mime.startsWith('video/') ? 'video' : (c.text ? 'text' : ''));
    if (t === 'text' && c.text) out.texts.push(c.text);
    else if (t === 'image' && (data || c.uri)) out.images.push({ data, uri: c.uri, mime: mime || 'image/png' });
    else if (t === 'video' && (data || c.uri)) out.videos.push({ data, uri: c.uri, mime: mime || 'video/mp4' });
  }
  const oi = inter.output_image, ov = inter.output_video;
  if (!out.images.length && oi && (oi.data || oi.uri)) out.images.push({ data: oi.data, uri: oi.uri, mime: oi.mime_type || 'image/png' });
  if (!out.videos.length && ov && (ov.data || ov.uri)) out.videos.push({ data: ov.data, uri: ov.uri, mime: ov.mime_type || 'video/mp4' });
  if (!out.texts.length && typeof inter.output_text === 'string') out.texts.push(inter.output_text);
  return out;
}

}
async function mediaToBlob(o) {

}

  const input = refs.map(r => ({ type: 'image', mime_type: r.mime || 'image/jpeg', data: r.b64 }));
  input.push({ type: 'text', text: prompt });
  const inter = await callModel('image', {
    input,
    response_format: { type: 'image', mime_type: 'image/jpeg', aspect_ratio: ratio, image_size: size || LS.get('imgSize', '1K') },
    store: false,
  });
  const out = extractOutputs(inter);
  if (!out.images.length) throw new ApiError(out.texts.join(' ').trim() || '이미지가 만들어지지 않았어요.', { code: 'BLOCKED' });
  return mediaToBlob(out.images[out.images.length - 1]);
}
async function loadRefs(ch) {
  const out = [];
  for (const id of (ch.refIds || []).slice(0, MAX_REFS)) {
    if (!RefB64.has(id)) {
      try { const b = await getBlob(id); const { blob } = await resizeBlob(b, 1024, 0.9); RefB64.set(id, await blobToB64(blob)); } catch { continue; }
    }
    out.push({ mime: 'image/jpeg', b64: RefB64.get(id) });
  }
  if (!out.length) throw new Error('기준 사진을 불러오지 못했어요');
  return out;
}

/* ----- 영상 작업 (백그라운드 + 폴링, 앱을 다시 열면 이어받기) ----- */
const polling = new Set();
const startingNow = new Set();
async function removeJob(id) { S.jobs = S.jobs.filter(j => j.id !== id); try { await DB.del('jobs', id); } catch {} }
async function failJob(job, e) {
  job.status = 'failed';
  job.error = friendlyError(e);
  job.errorRaw = String((e && e.message) || e).slice(0, 600);
  const j = S.jobs.find(x => x.id === job.id);
  if (j && j !== job) Object.assign(j, job);
  try { await DB.put('jobs', job); } catch {}
  toast('영상 생성 실패: ' + job.error, 4500);
  renderSoon(); updateWakeLock();
}
async function finishVideoJob(job, inter) {
  const out = extractOutputs(inter);
  if (!out.videos.length) throw new ApiError(out.texts.join(' ').trim() || (inter && inter.error && inter.error.message) || '영상이 만들어지지 않았어요.', { code: 'BLOCKED' });
  const blob = await mediaToBlob(out.videos[out.videos.length - 1]);
  const m = await saveMediaRec({ charId: job.charId, kind: 'video', blob, thumb: job.thumb, label: job.label, prompt: job.prompt, ratio: job.ratio, sourceId: job.sourceId });
  addUsage('videos', (COST.vidSec[job.res] || 0.1) * (job.secs || COST.vidLen));
  await removeJob(job.id);
  if (S.charId === job.charId) S.media.unshift(m);
  const ch = S.chars.find(c => c.id === job.charId);
  toast(`🎬 ${ch ? ch.name + '의 ' : ''}영상이 완성됐어요!`, 3500);
  renderSoon(); updateWakeLock();
}
async function startVideo(prm) {
  const job = { id: uid(), ...prm, createdAt: Date.now(), status: 'starting' };
  S.jobs.push(job); startingNow.add(job.id);
  try { await DB.put('jobs', job); } catch {}
  renderSoon(); updateWakeLock();
  try {
    let body;
    if (prm.mode === 'scene') {
      // 새 장면: 기준 사진들은 얼굴 참고용 (첫 장면으로 쓰지 않음)
      const ch = S.chars.find(c => c.id === prm.charId);
      if (!ch) throw new ApiError('인물을 찾지 못했어요');
      const refs = await loadRefs({ refIds: (prm.refIds && prm.refIds.length ? prm.refIds : ch.refIds) });
      body = {
        input: [...refs.map(r => ({ type: 'image', mime_type: r.mime, data: r.b64 })), { type: 'text', text: refHeader(refs.length) + '\n' + prm.prompt }],
        response_format: { type: 'video', aspect_ratio: prm.ratio, resolution: prm.res },
        generation_config: { video_config: { task: 'reference_to_video' } },
      };
    } else {
      const src = await getBlob(prm.sourceId);
      const { blob: small } = await resizeBlob(src, 1280, 0.9);
      const b64 = await blobToB64(small);
      body = {
        input: [{ type: 'image', mime_type: 'image/jpeg', data: b64 }, { type: 'text', text: prm.prompt }],
        response_format: { type: 'video', aspect_ratio: prm.ratio, resolution: prm.res },
      };
    }
    const inter = await callModel('video', body, { background: true });
    if (inter.status === 'completed' || (!inter.status && hasMedia(inter))) {
      await finishVideoJob(job, inter);
    } else if (inter.id && (inter.status === 'in_progress' || inter.status === 'queued' || !inter.status)) {
      job.iid = inter.id; job.status = 'running';
      try { await DB.put('jobs', job); } catch {}
      pollJob(job);
    } else throw new ApiError(interFailMsg(inter));
  } catch (e) { await failJob(job, e); }
  finally { startingNow.delete(job.id); renderSoon(); }
}
async function pollJob(job) {
  if (polling.has(job.id)) return;
  polling.add(job.id); updateWakeLock();
  try {
    let errs = 0;
    for (;;) {
      await sleep(5000);
      if (!S.jobs.some(j => j.id === job.id)) return;
      if (Date.now() - job.createdAt > 30 * 60e3) throw new ApiError('30분이 지나도 끝나지 않아 중단했어요');
      let inter;
      try { inter = await gfetch('/interactions/' + encodeURIComponent(job.iid), { method: 'GET' }); errs = 0; }
      catch (e) { if ((e.network || e.status >= 500 || e.status === 429) && ++errs < 40) continue; throw e; }
      const st = inter.status;
      if (st === 'completed' || (!st && hasMedia(inter))) { await finishVideoJob(job, inter); return; }
      if (st && st !== 'in_progress' && st !== 'queued') throw new ApiError(interFailMsg(inter));
    }
  } catch (e) { await failJob(job, e); }
  finally { polling.delete(job.id); updateWakeLock(); renderSoon(); }
}
function resumeJobs() {
  for (const j of S.jobs) {
    if (j.status === 'running' && j.iid) pollJob(j);
    else if (j.status === 'starting' && !startingNow.has(j.id)) failJob(j, new Error('앱이 닫히거나 새로고침되어 영상 요청이 중단됐어요. 다시 시도해 주세요.'));
  }
}

let wakeLock = null;
async function updateWakeLock() {
  const need = !!S.busy || !!S.create.busy || S.jobs.some(j => j.status === 'running' || j.status === 'starting');
  try {
    if (need && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!need && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch {}
}

/* ================= 오류 메시지 ================= */
function friendlyError(e) {
  if (!e) return '알 수 없는 오류가 생겼어요.';
  const m = String(e.message || e);
  if (e.code === 'NO_KEY') return 'Gemini API 키를 먼저 설정해 주세요.';
  if (e.name === 'QuotaExceededError') return '폰 저장공간이 부족해요. 오래된 영상을 지우거나 백업 후 정리해 주세요.';
  if (e.network) return '인터넷 연결을 확인해 주세요.';
  if (/API key not valid|API_KEY_INVALID|invalid api key/i.test(m)) return 'API 키가 올바르지 않아요. 설정에서 다시 확인해 주세요.';
  if (e.status === 429) return /billing|free.?tier|limit:\s*0|prepay|credits/i.test(m) ? '무료 등급 키로는 이미지·영상 생성이 안 돼요. Google AI Studio에서 결제를 연결해 주세요.' : '요청 한도에 걸렸어요. 1분쯤 뒤에 다시 시도해 주세요.';
  if (e.status === 401 || e.status === 403) return /billing|paid|prepay/i.test(m) ? '이 기능은 결제가 연결된 키에서만 돼요. Google AI Studio에서 결제를 연결해 주세요.' : '권한이 없어요. API 키와 결제 설정을 확인해 주세요.';
  if (e.status >= 500) return 'Google 서버가 잠시 불안정해요. 조금 뒤 다시 시도해 주세요.';
  if (e.code === 'BLOCKED' || /safety|blocked|prohibited|policy|recognizable/i.test(m)) return '안전 정책 때문에 만들어지지 않았어요. 장면·의상·대사 표현을 바꿔 다시 시도해 보세요.';
  if (e.status === 400) return '요청이 거절됐어요: ' + m.slice(0, 160);
  return m.slice(0, 220);
}

function toast(msg, ms = 2600) {
  const box = $('#toasts');
  while (box.children.length >= 2) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, ms);
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
function canShareFile(b, name) { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([b], name, { type: b.type })] })); } catch { return false; } }
function shareFile(b, name, title) {
  let file;
  try { file = new File([b], name, { type: b.type }); } catch { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: title || 'MUSE' }).catch(e => {
      if (e && e.name !== 'AbortError') { downloadBlob(b, name); toast('공유가 안 돼서 파일로 저장했어요'); }
    });
  } else { downloadBlob(b, name); toast('이 브라우저는 공유를 지원하지 않아 파일로 저장했어요'); }
}
function fileNameFor(m) {
  const ch = S.chars.find(c => c.id === m.charId);
  const base = ((ch && ch.name) || 'MUSE').replace(/[\\/:*?"<>|\s]+/g, '_');
  const d = new Date(m.createdAt);
  const ext = m.kind === 'video' ? 'mp4' : (/png/.test(m.mime) ? 'png' : 'jpg');
  return `${base}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.${ext}`;
}

  async load() {
    const id = this.list[this.idx];
    const meta = S.media.find(m => m.id === id) || await DB.get('media', id);
    if (!meta) { ACT.vClose(); return; }
    this.meta = meta; this.blob = null;

  const allowed = [true, !!c.profile, c.cands.length > 0];
  const stepper = `<div class="stepper">${names.map((n, i) => `<button class="${i + 1 <= stepNow ? 'on' : ''}" data-act="createStep" data-step="${i + 1}" ${allowed[i] && !c.busy ? '' : 'disabled'}><i></i>${i + 1}. ${n}</button>`).join('')}</div>`;
  let body;
  if (c.busy === 'analyze') body = vAnalyzing();
  else if (c.step === 2 && c.profile) body = vCreate2();
  else if (c.step === 3 && c.cands.length) body = vCreate3();
  else body = vCreate1();
  return `
  <header class="topbar">
    <button class="icon-btn" data-act="back" aria-label="뒤로">${icon('back')}</button>
    <h1>새 인물 만들기</h1>
    ${(c.photos.length || c.profile) && !c.busy ? '<button class="text-btn" data-act="resetCreate">처음부터</button>' : ''}
  </header>
  ${stepper}${body}`;
}

/* ================= 렌더 ================= */
function render() {
  const app = $('#app');
  const ae = document.activeElement;
  let focusPath = null, s0 = 0, s1 = 0;
  if (ae && ae.dataset && ae.dataset.bind && app.contains(ae)) { focusPath = ae.dataset.bind; try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch {} }
  let html;
  if (S.view === 'create') html = vCreate();
  else if (S.view === 'char') html = vChar();
  else if (S.view === 'settings') html = vSettings();
  else html = vHome();
  app.innerHTML = `<div class="wrap">${html}</div>`;
  if (focusPath) {
    const el = $(`[data-bind="${focusPath}"]`, app);
    if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(s0, s1); } catch {} }
  }
  if (S.view === 'settings') fillStorage();
  tick();
}
let rq = 0;
function renderSoon() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
function tick() {
  const now = Date.now();
  $$('[data-since]').forEach(el => { el.textContent = fmtTime(Math.max(0, Math.floor((now - Number(el.dataset.since)) / 1000))); });
  $$('[data-rotate]').forEach(el => { const arr = el.dataset.rotate.split('|'); const t = arr[Math.floor(now / 2600) % arr.length]; if (el.textContent !== t) el.textContent = t; });
}
async function fillStorage() {
  try {
    if (!navigator.storage || !navigator.storage.estimate) return;
    const e = await navigator.storage.estimate();
    const el = $('#storageInfo'); if (el) el.textContent = `(사용 중 ${(e.usage / 1048576).toFixed(1)}MB)`;
  } catch {}
}

/* ================= 이동 ================= */
function go(view, params = {}, opt = {}) {
  Object.assign(S, params); S.view = view;
  const cur = history.state || {};
  const d = (cur.d || 0) + (opt.replace ? 0 : 1);
  const st = { view, charId: S.charId, d };
  try { opt.replace ? history.replaceState(st, '') : history.pushState(st, ''); } catch {}
  enterView(true);
}
async function enterView(scrollTop) {
  try {
    if (S.view === 'home') await loadChars();
    else if (S.view === 'char') { if (!S.chars.length) await loadChars(); await loadCharMedia(); }
  } catch (e) { console.error(e); }
  render();
  if (scrollTop) window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  if (Sheet.open) { Sheet._close(); return; }
  if (Viewer.open) { Viewer.close(); return; }
  const st = e.state || { view: 'home' };
  S.view = st.view || 'home'; S.charId = st.charId || null;
  enterView(false);
});

  tab: el => { S.tab = el.dataset.tab; render(); },

  /* 홈 */
  newChar: () => go('create'),
  openChar: el => go('char', { charId: el.dataset.id, tab: 'photo', galFilter: 'all' }),

  /* 새 인물 */
  pickPhotos: () => { if (S.create.photos.length >= 5) return toast('5장까지 고를 수 있어요'); $('#pickPhotos').click(); },
  removePhoto: el => { const c = S.create; const i = Number(el.dataset.i); const p = c.photos[i]; if (p && p.url) URL.revokeObjectURL(p.url); c.photos.splice(i, 1); render(); },
  resetCreate: async () => { if (!(await confirmSheet('처음부터 다시 할까요?', '고른 사진과 분석 결과가 사라져요.', '다시 시작'))) return; resetCreate(); render(); },
  createStep: el => { const c = S.create, s = Number(el.dataset.step); if (c.busy) return; if (s === 2 && !c.profile) return; if (s === 3 && !c.cands.length) return; c.step = s; render(); window.scrollTo(0, 0); },
  analyze: async () => {
    const c = S.create;
    if (c.photos.length < 3) return toast('사진을 3장 이상 골라 주세요 (5장 추천)');
    if (!getKey()) return needKey();
    c.busy = 'analyze'; c.busyAt = Date.now(); render(); window.scrollTo(0, 0); updateWakeLock();
    try {
      const prof = await analyzePhotos(c.photos, c.prefs);
      c.profile = prof; c.step = 2; addUsage('analyses', 0.001);
    } catch (e) { c.step = c.profile ? 2 : 1; c.busy = null; render(); showError(e, '취향 분석 실패'); }
    finally { c.busy = null; render(); updateWakeLock(); }
  },
  genCands: async el => {
    const c = S.create, p = c.profile;
    if (!p || c.busy) return;
    if (!getKey()) return needKey();
    const mode = el.dataset.mode || 'fresh';
    const tweak = mode === 'tweak' ? [...c.tweaks, c.tweakText.trim()].filter(Boolean).join(', ') : '';
    if (mode === 'tweak' && !tweak) return toast('바꾸고 싶은 점을 고르거나 적어 주세요');
    const keep = c.sel >= 0 && c.cands[c.sel] && c.cands[c.sel].status === 'done' ? c.cands[c.sel] : null;
    c.busy = 'cands'; render(); updateWakeLock();
    let baseB64 = null;
    try { if (mode === 'tweak' && keep) baseB64 = await blobToB64((await resizeBlob(keep.blob, 1024, 0.9)).blob); }
    catch (e) { c.busy = null; render(); updateWakeLock(); return showError(e); }
    c.cands.forEach(x => { if (x !== keep && x.url) URL.revokeObjectURL(x.url); });
    c.cands = keep ? [keep] : []; c.sel = keep ? 0 : -1;
    const nNew = keep ? 3 : 4;
    for (let i = 0; i < nNew; i++) c.cands.push({ status: 'loading', args: { tweak, baseB64 } });
    if (mode === 'tweak') { c.tweaks = []; c.tweakText = ''; }
    c.step = 3; c.busy = 'cands'; render(); window.scrollTo(0, 0); updateWakeLock();
    await Promise.allSettled(c.cands.map((cd, i) => cd.status === 'loading' ? runCand(cd, i) : null));
    if (S.create !== c) return;
    c.busy = null; render(); updateWakeLock();
    const fresh = c.cands.filter(x => x !== keep);
    if (fresh.length && fresh.every(x => x.status === 'error')) showError(fresh[0].error, '얼굴 생성 실패');
  },
  retryCand: async el => {
    const c = S.create, i = Number(el.dataset.i), cd = c.cands[i];

    render();

    const scene = f.preset === 'custom' ? f.custom.trim() : sc.en;
    if (!scene) return toast('어떤 장면인지 적어 주세요');
    const shot = (SHOTS.find(s => s.id === f.shot) || SHOTS[1]).en;
    const label = f.preset === 'custom' ? f.custom.trim().slice(0, 24) : `${sc.e} ${sc.ko}`;
    const n = Number(f.count) || 1, size = LS.get('imgSize', '1K'), ratio = f.ratio;
    S.busy = { kind: 'photo', charId: ch.id, total: n, done: 0, startedAt: Date.now() };
    render(); window.scrollTo({ top: 0, behavior: 'smooth' }); updateWakeLock();
    let refs;
    try { refs = await loadRefs(ch); } catch (e) { S.busy = null; render(); updateWakeLock(); return showError(e); }
    const prompt = scenePrompt(ch, { scene, shot, outfit: f.outfit.trim(), ratio });
    const results = await Promise.allSettled(Array.from({ length: n }, async () => {
      const blob = await generateImage({ refs, prompt, ratio, size });
      const thumb = await makeThumb(blob);
      const m = await saveMediaRec({ charId: ch.id, kind: 'image', blob, thumb, label, prompt, ratio });
      addUsage('images', COST.img[size] || COST.img['1K']);
      if (S.charId === ch.id) S.media.unshift(m);
      if (S.busy) S.busy.done++;
      renderSoon();
    }));
    S.busy = null; updateWakeLock();
    ch.updatedAt = Date.now(); DB.put('chars', ch).catch(() => {});
    render();
    const fails = results.filter(r => r.status === 'rejected');
    if (fails.length === n) showError(fails[0].reason, '사진 생성 실패');
    else if (fails.length) toast(`${n - fails.length}장 완성, ${fails.length}장 실패`, 3500);
    else toast(n > 1 ? `사진 ${n}장 완성! 📸` : '사진 완성! 📸');
  },
  genVideo: () => {
    const ch = curChar(); if (!ch) return;
    if (!getKey()) return needKey();
    const f = S.videoForm;
    const scene = f.src === 'scene';
    let src = null;
    if (scene) {
      if (!(ch.refIds || []).length) return toast('기준 사진이 없어요. 사진 탭에서 기준 사진을 정해 주세요');
      if (f.scene === 'custom' && !String(f.sceneCustom || '').trim()) return toast('어떤 장소인지 적어 주세요');
    } else {
      src = S.media.find(m => m.id === f.sourceId && m.kind === 'image') || S.media.find(m => m.kind === 'image');
      if (!src) return toast('먼저 사진을 만들어 주세요');
    }
    const mo = MOTIONS.find(m => m.id === f.motion) || MOTIONS[0];
    if (f.motion === 'custom' && !String(f.custom || '').trim()) return toast('어떤 움직임인지 적어 주세요');
    if (f.ambient === 'custom' && !String(f.ambientCustom || '').trim()) return toast('배경 소리를 적어 주세요');
    if (f.music === 'custom' && !String(f.musicCustom || '').trim()) return toast('배경 음악을 적어 주세요');
    const line = String(f.line || '').trim();
    const prompt = videoPrompt(ch, f);
    const sc = scene ? findOpt(SCENES, f.scene) : null;
    const label = (scene ? `${sc.e} ${f.scene === 'custom' ? String(f.sceneCustom).trim().slice(0, 12) : sc.ko} · ` : '')
      + (f.motion === 'custom' ? String(f.custom).trim().slice(0, 16) : `${mo.e} ${mo.ko}`) + (line ? ' · 대사' : '');
    const refThumb = scene ? (S.media.find(m => m.id === ch.refIds[0]) || {}).thumb : null;
    startVideo({ charId: ch.id, mode: scene ? 'scene' : 'photo', sourceId: scene ? ch.refIds[0] : src.id, refIds: scene ? ch.refIds.slice(0, MAX_REFS) : null,
      prompt, label, ratio: f.ratio, res: f.res, secs: f.secs, thumb: scene ? (refThumb || null) : src.thumb });
    toast('영상 요청을 보냈어요. 보통 1~3분 걸려요 🎬', 3200);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  retryJob: async el => {
    const j = S.jobs.find(x => x.id === el.dataset.id); if (!j) return;
    await removeJob(j.id);
    startVideo({ charId: j.charId, mode: j.mode, sourceId: j.sourceId, refIds: j.refIds, prompt: j.prompt, label: j.label, ratio: j.ratio, res: j.res, secs: j.secs, thumb: j.thumb });
  },
  dismissJob: async el => { await removeJob(el.dataset.id); render(); },
  jobDetail: el => { const j = S.jobs.find(x => x.id === el.dataset.id); if (j) Sheet.show(`<h3>오류 자세히</h3><pre class="raw">${esc(j.errorRaw || '')}</pre><button class="btn btn-primary full" style="margin-top:14px" data-sheet-val="">확인</button>`); },

  /* 뷰어 */
  openMedia: el => {
    const id = el.dataset.id, ch = curChar(), L = el.dataset.list;
    if (!id || !ch) return;
    let list;
    if (L === 'refs') list = ch.refIds.slice();
    else if (L === 'gallery') list = galleryItems(ch).map(m => m.id);
    else if (L === 'recent-img') list = (S.recent[ch.id] || []).filter(x => S.media.some(m => m.id === x && m.kind === 'image'));
    else if (L === 'recent-vid') list = (S.recent[ch.id] || []).filter(x => S.media.some(m => m.id === x && m.kind === 'video'));
    Viewer.show(id, list);
  },
  vClose: () => { if (history.state && history.state.viewer) history.back(); else Viewer.close(); },
  vPrev: () => Viewer.go(-1),
  vNext: () => Viewer.go(1),
  vInfo: el => { Viewer.info = !Viewer.info; const box = $('.v-info'); if (box) box.classList.toggle('hide', !Viewer.info); el.classList.toggle('on', Viewer.info); },
  vSave: () => {
    const m = Viewer.meta, b = Viewer.blob; if (!m || !b) return;
    const name = fileNameFor(m);
    if (isIOS() && canShareFile(b, name)) {
      toast(m.kind === 'video' ? "공유 메뉴에서 ‘비디오 저장’을 누르세요" : "공유 메뉴에서 ‘이미지 저장’을 누르세요", 3500);
      shareFile(b, name, 'MUSE');
    } else { downloadBlob(b, name); toast('저장했어요 · 다운로드 폴더/갤러리에서 볼 수 있어요', 3000); }
  },
  vShare: () => { const m = Viewer.meta, b = Viewer.blob; if (!m || !b) return; const ch = curChar(); shareFile(b, fileNameFor(m), ch ? ch.name : 'MUSE'); },
  vToVideo: () => {
    const m = Viewer.meta; if (!m) return;
    S.videoForm.sourceId = m.id; S.videoForm.src = 'photo'; S.tab = 'video';
    ACT.vClose(); render(); window.scrollTo(0, 0);
    toast('이 사진으로 영상을 만들어요 🎬');
  },
  vRef: async () => {
    const m = Viewer.meta, ch = curChar(); if (!m || !ch) return;
    if (ch.refIds.includes(m.id)) {
      if (ch.refIds.length <= 1) return toast('기준 사진은 최소 1장 있어야 해요');
      ch.refIds = ch.refIds.filter(x => x !== m.id);
      toast('기준 사진에서 뺐어요');
    } else {
      if (ch.refIds.length >= MAX_REFS) return toast(`기준 사진은 ${MAX_REFS}장까지예요. 하나를 먼저 빼 주세요`);
      ch.refIds = [...ch.refIds, m.id];
      toast('기준 사진으로 지정! 다음 생성부터 얼굴 맞추는 데 써요', 3000);
    }
    ch.updatedAt = Date.now();
    await DB.put('chars', ch);
    Viewer.render(); render();
  },
  vMore: async () => {
    const m = Viewer.meta, ch = curChar(); if (!m || !ch) return;
    const a = await menuSheet(null, [
      ...(m.kind === 'image' ? [{ act: 'cover', label: '대표 사진으로 지정', icon: 'user' }] : []),
      { act: 'delete', label: '삭제', icon: 'trash', danger: true },
    ]);
    if (a === 'cover') {
      ch.coverId = m.id; ch.coverThumb = m.thumb; ch.updatedAt = Date.now();
      await DB.put('chars', ch); render(); toast('대표 사진으로 바꿨어요');
    } else if (a === 'delete') {
      if (ch.refIds.includes(m.id) && ch.refIds.length <= 1) return toast('마지막 기준 사진은 지울 수 없어요. 다른 사진을 기준으로 지정한 뒤 지워 주세요', 3800);
      if (!(await confirmSheet('삭제할까요?', '이 기기에서 완전히 지워져요.', '삭제', true))) return;
      ch.refIds = ch.refIds.filter(x => x !== m.id);
      if (ch.coverId === m.id) { const nc = S.media.find(x => x.id === ch.refIds[0]); ch.coverId = nc ? nc.id : null; ch.coverThumb = nc ? nc.thumb : ch.coverThumb; }
      await DB.del('media', m.id); await DB.del('blobs', m.id); BlobCache.delete(m.id); RefB64.delete(m.id);
      await DB.put('chars', ch);
      S.media = S.media.filter(x => x.id !== m.id);
      const cnt = S.counts[ch.id]; if (cnt) { if (m.kind === 'video') cnt.vid--; else cnt.img--; }
      Viewer.list = Viewer.list.filter(x => x !== m.id);
      render(); toast('삭제했어요');
      if (!Viewer.list.length) { ACT.vClose(); return; }
      Viewer.idx = Math.min(Viewer.idx, Viewer.list.length - 1);
      Viewer.load();
    }
  },

  /* 설정 */
  toggleKey: () => { const i = $('#keyInput'); if (i) i.type = i.type === 'password' ? 'text' : 'password'; },
  saveKey: () => {
    const v = ($('#keyInput') || {}).value || '';
    LS.set('apiKey', v.trim());
    toast(v.trim() ? 'API 키를 저장했어요' : 'API 키를 지웠어요');
    render();
    if (v.trim()) runKeyTest(v.trim());
  },
  testKey: () => { const v = (($('#keyInput') || {}).value || '').trim() || getKey(); if (!v) return toast('키를 먼저 입력해 주세요'); runKeyTest(v); },
  setImgSize: el => { LS.set('imgSize', el.dataset.val); render(); },
  resetUsage: () => { LS.set('usage', { images: 0, videos: 0, analyses: 0, cost: 0 }); render(); },
  saveModels: () => {
    const v = { analysis: $('#mAnalysis').value.trim() || MODEL_DEFAULTS.analysis, image: $('#mImage').value.trim() || MODEL_DEFAULTS.image, video: $('#mVideo').value.trim() || MODEL_DEFAULTS.video };
    LS.set('models', v); for (const k in modelOK) delete modelOK[k];
    toast('모델 설정을 저장했어요'); render();
  },
  resetModels: () => { LS.set('models', {}); for (const k in modelOK) delete modelOK[k]; toast('기본값으로 되돌렸어요'); render(); },
  exportBackup: async el => {
    const withVideos = $('#bkVideo') ? $('#bkVideo').checked : true;
    const box = $('#backupReady');
    el.disabled = true;
    if (box) box.innerHTML = '<p class="sub"><span class="spinner sm"></span> 백업 파일 만드는 중…</p>';
    try {
      const { blob, name, count } = await buildBackup({ withVideos });
      S.backup = { blob, name };
      if (box) box.innerHTML = `<div class="backup-ready">${esc(name)} · ${(blob.size / 1048576).toFixed(1)}MB · 파일 ${count}개<div class="row2"><button class="btn btn-ghost" data-act="saveBackup">${icon('download')} 저장</button><button class="btn btn-primary" data-act="shareBackup">${icon('share')} 공유</button></div></div>`;
    } catch (e) { if (box) box.innerHTML = ''; showError(e, '백업 실패'); }
    finally { el.disabled = false; }
  },
  saveBackup: () => { if (S.backup) { downloadBlob(S.backup.blob, S.backup.name); toast('백업 파일을 저장했어요'); } },
  shareBackup: () => { if (S.backup) shareFile(S.backup.blob, S.backup.name, 'MUSE 백업'); },
  importBackup: () => $('#pickBackup').click(),
  wipeAll: async () => {
    if (!(await confirmSheet('정말 모두 삭제할까요?', '모든 인물과 사진·영상이 이 기기에서 지워져요. 되돌릴 수 없어요. (API 키는 남아요)', '모두 삭제', true))) return;
    for (const s of ['chars', 'media', 'blobs', 'jobs']) await DB.clear(s);
    BlobCache.clear(); RefB64.clear(); S.recent = {}; S.media = []; S.jobs = [];
    await loadChars(); render(); toast('모두 삭제했어요');
  },
};

function resetCreate() {
  const c = S.create;
  c.photos.forEach(p => p.url && URL.revokeObjectURL(p.url));
  c.cands.forEach(x => x.url && URL.revokeObjectURL(x.url));
  S.create = freshCreate();
}
async function runCand(cd, i) {
  const c = S.create;
  const p = c.profile;
  const { tweak, baseB64 } = cd.args || {};
  cd.status = 'loading'; cd.error = null; renderSoon();
  try {
    const refs = baseB64 ? [{ mime: 'image/jpeg', b64: baseB64 }] : [];
    const prompt = baseB64 ? tweakPrompt(p, tweak) : portraitPrompt(p, ANGLES[i % ANGLES.length], tweak);
    const blob = await generateImage({ refs, prompt, ratio: '3:4', size: '1K' });
    cd.blob = blob; cd.url = URL.createObjectURL(blob); cd.prompt = prompt; cd.status = 'done';
    addUsage('images', COST.img['1K']);
  } catch (e) { cd.status = 'error'; cd.error = e; }
  renderSoon();
}
async function runKeyTest(key) {
  const box = $('#testResult');
  const set = h => { const b = $('#testResult'); if (b) b.innerHTML = h; };
  if (box) set('<div class="test-list"><div><span>연결 확인 중…</span><span class="spinner sm"></span></div></div>');
  try { await gfetch('/models?pageSize=1', { method: 'GET', key }); }
  catch (e) { set(`<div class="test-list"><div class="bad">✗ ${esc(friendlyError(e))}</div></div>`); return; }
  const m = getModels(), rows = [];
  for (const [k, label] of [['analysis', '취향 분석'], ['image', '사진 생성'], ['video', '영상 생성']]) {
    let st;
    try { await gfetch('/models/' + encodeURIComponent(m[k]), { method: 'GET', key }); st = '<span class="ok">✓ 사용 가능</span>'; }
    catch (e) { st = e.status === 404 ? '<span class="bad">✗ 목록에 없음</span>' : '<span class="dim">? 확인 불가</span>'; }
    rows.push(`<div><span>${label} <small class="mono">${esc(m[k])}</small></span>${st}</div>`);
  }
  set(`<div class="test-list"><div class="ok">✓ 키 연결 성공</div>${rows.join('')}<p class="hint" style="margin-top:6px">결제(유료 등급) 연결 여부는 실제로 사진을 만들 때 확인돼요.</p></div>`);
}
async function buildBackup({ withVideos = true, charIds = null, label = '' } = {}) {
  const chars = (await DB.all('chars')).filter(c => !charIds || charIds.includes(c.id));
  const ids = new Set(chars.map(c => c.id));
  const metas = (await DB.all('media')).filter(m => ids.has(m.charId) && (withVideos || m.kind !== 'video'));
  const parts = [`{"app":"muse-studio","version":1,"exportedAt":${Date.now()},"chars":${JSON.stringify(chars)},"media":[`];
  let first = true, count = 0;
  for (const m of metas) {
    const rec = await DB.get('blobs', m.id); if (!rec) continue;
    const b64 = await blobToB64(new Blob([rec.buf], { type: rec.mime }));
    parts.push((first ? '' : ',') + JSON.stringify({ ...m, b64 }));
    first = false; count++;
  }
  parts.push(']}');
  const d = new Date();
  const name = `MUSE_backup_${label ? label.replace(/[\\/:*?"<>|\s]+/g, '_') + '_' : ''}${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  return { blob: new Blob(parts, { type: 'application/json' }), name, count };
}

/* ================= 이벤트 ================= */
document.addEventListener('click', async e => {
  const back = e.target.closest('[data-sheet-close]');
  if (back && e.target === back) { Sheet.done(null); return; }
  const sv = e.target.closest('[data-sheet-val]');
  if (sv) { Sheet.done(sv.dataset.sheetVal); return; }
  const sub = e.target.closest('[data-sheet-submit]');
  if (sub) { const vals = {}; $$('#sheetRoot [data-field]').forEach(i => { vals[i.dataset.field] = i.value; }); Sheet.done(vals); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { await fn(el, e); } catch (err) { showError(err); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el && el.dataset && el.dataset.bind) { try { setPath(S, el.dataset.bind, el.value); } catch {} }
});
document.addEventListener('keydown', e => {
  if (Sheet.open) { if (e.key === 'Escape') Sheet.done(null); return; }
  if (!Viewer.open) return;
  if (e.key === 'ArrowLeft') Viewer.go(-1);
  else if (e.key === 'ArrowRight') Viewer.go(1);
  else if (e.key === 'Escape') ACT.vClose();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { updateWakeLock(); resumeJobs(); } });

$('#pickPhotos').addEventListener('change', async e => {
  const files = [...(e.target.files || [])];
  e.target.value = '';
  if (!files.length) return;
  const c = S.create;
  const room = 5 - c.photos.length;
  if (room <= 0) return toast('5장까지 고를 수 있어요');
  if (files.length > room) toast(`${room}장만 추가했어요 (최대 5장)`);
  c.loadingPhotos = true; render();
  let bad = 0;
  for (const f of files.slice(0, room)) {
    try {
      const { blob } = await resizeBlob(f, 1024, 0.86);
      c.photos.push({ id: uid(), url: URL.createObjectURL(blob), b64: await blobToB64(blob) });
    } catch { bad++; }
    render();
  }
  c.loadingPhotos = false; render();
  if (bad) toast(`읽을 수 없는 사진 ${bad}장은 뺐어요 (JPG/PNG 권장)`, 3500);
});
$('#pickBackup').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  toast('백업 불러오는 중…');
  try {
    const data = JSON.parse(await f.text());
    if (!data || data.app !== 'muse-studio') throw new Error('MUSE 백업 파일이 아니에요');
    let nc = 0, nm = 0;
    for (const m of data.media || []) {
      const { b64, ...meta } = m;
      if (!b64 || !meta.id || !meta.charId) continue;
      const blob = await b64ToBlob(b64, meta.mime);
      await DB.put('blobs', { id: meta.id, buf: await blob.arrayBuffer(), mime: meta.mime });
      await DB.put('media', meta); nm++;
    }
    for (const c of data.chars || []) { if (!c || !c.id) continue; await DB.put('chars', c); nc++; }
    await loadChars(); render();
    toast(`불러오기 완료 · 인물 ${nc}명, 파일 ${nm}개`, 3500);
  } catch (err) { showError(err, '불러오기 실패'); }
});

/* ================= 앱 아이콘 / 설치 ================= */
function setupAppIcons() {
  try {
    const mk = size => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const g = c.getContext('2d');
      const bg = g.createLinearGradient(0, 0, size, size); bg.addColorStop(0, '#1a0a26'); bg.addColorStop(1, '#07070c');
      g.fillStyle = bg; g.fillRect(0, 0, size, size);
      const rg = g.createRadialGradient(size * 0.5, size * 0.45, size * 0.05, size * 0.5, size * 0.5, size * 0.6);
      rg.addColorStop(0, 'rgba(255,79,216,.55)'); rg.addColorStop(0.6, 'rgba(165,92,255,.18)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(0, 0, size, size);
      const tg = g.createLinearGradient(size * 0.2, size * 0.2, size * 0.8, size * 0.8);
      tg.addColorStop(0, '#ff4fd8'); tg.addColorStop(0.5, '#a55cff'); tg.addColorStop(1, '#22e1ff');
      g.fillStyle = tg; g.shadowColor = 'rgba(255,79,216,.8)'; g.shadowBlur = size * 0.08;
      g.font = `900 ${Math.round(size * 0.56)}px -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('M', size / 2, size * 0.54);
      return c.toDataURL('image/png');
    };
    const i180 = mk(180), i192 = mk(192), i512 = mk(512);
    $('#touchIcon').href = i180; $('#favIcon').href = i192;
    const base = location.href.split('#')[0].split('?')[0];
    const man = { name: 'MUSE 가상인물 스튜디오', short_name: 'MUSE', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#07070c', theme_color: '#07070c', icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png' }] };
    $('#manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
  } catch (e) { console.warn(e); }
}

/* ================= 시작 ================= */
async function init() {
  setupAppIcons();
  try { history.replaceState({ view: 'home', d: 0 }, ''); } catch {}
  try { await loadChars(); }
  catch (e) { console.error(e); toast('저장소를 열 수 없어요. 개인정보 보호(시크릿) 모드라면 일반 모드로 열어 주세요.', 5000); }
  render();
  resumeJobs();
  setInterval(tick, 1000);
}
window.__muse = { S, extractOutputs, friendlyError }; // 디버그용
init();
})();
